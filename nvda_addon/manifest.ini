# Manifiesto del complemento de zCommander para NVDA (diseño 2.0, 10.16).
#
# tools/construir_complemento.py sustituye los marcadores @NOMBRE@, @VERSION@,
# @NVDA_MINIMA@, @NVDA_PROBADA@, @AUTOR@, @URL@ y @CAMBIOS@ y quita estos
# comentarios. Si un marcador opcional (@URL@, @CAMBIOS@) queda vacío, se quita
# la línea entera.
#
# Este manifiesto raíz va en inglés, como hace NVDA: es el que ve quien usa NVDA
# en un idioma sin traducción. El texto en español está en
# addon/locale/es/manifest.ini y NVDA lo elige si su idioma es el español.
name = @NOMBRE@
summary = "zCommander: better NVDA support"
description = """Improves how NVDA reads zCommander, the accessible file manager: full text of list cells beyond 511 characters, no repeated announcement when zCommander moves the focus by itself, the column reading order chosen in zCommander, and NVDA+shift+j to read the whole focused row with its column headers."""
author = "@AUTOR@"
url = @URL@
version = @VERSION@
changelog = """@CAMBIOS@"""
docFileName = readme.html
minimumNVDAVersion = @NVDA_MINIMA@
lastTestedNVDAVersion = @NVDA_PROBADA@
