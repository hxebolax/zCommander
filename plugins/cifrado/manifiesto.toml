etiqueta = "C&oste de la contraseña:"
ayuda = "Cuánto trabajo cuesta probar cada contraseña. «Alto» resiste mejor a quien intente adivinarla, pero reserva más de medio gigabyte de memoria al cifrar y al descifrar."
pagina = "general"

[[configuracion]]
clave = "borrar_originales"
tipo = "bool"
defecto = false
etiqueta = "&Enviar los originales a la papelera tras comprobar el cifrado"
