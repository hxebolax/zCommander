[[configuracion]]
clave = "version_id3"
tipo = "opcion"
defecto = "2.3"
opciones = [["2.3", "ID3 2.3 (la que leen todos los reproductores)"], ["2.4", "ID3 2.4"]]
etiqueta = "Versión de &ID3 al guardar MP3:"
ayuda = "Versión de las etiquetas ID3 que se escribe en los MP3 y WAV. La 2.3 la leen todos los reproductores, también los antiguos y los de los coches."
pagina = "general"

[[configuracion]]
clave = "conservar_fechas"
tipo = "bool"
defecto = true
etiqueta = "Conservar la &fecha de los archivos al cambiar sus etiquetas"
ayuda = "Al guardar etiquetas, el archivo conserva su fecha de modificación: el orden por fecha del panel no cambia."
pagina = "general"

[[configuracion]]
clave = "columnas_musica"
tipo = "bool"
defecto = true
etiqueta = "Proponer el conjunto de columnas «&Música»"
ayuda = "Al activarse el complemento, crea (si no existe) el conjunto de columnas Música (Pista, Artista, Título, Álbum y Duración) y su regla: se usa en las carpetas con mayoría de archivos de audio."
pagina = "general"

