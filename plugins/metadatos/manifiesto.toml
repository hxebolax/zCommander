formato = 1
id = "zc.metadatos"
bloque = "P1"
nombre = "Metadatos y etiquetas de audio"
descripcion = "Lee y edita las etiquetas de MP3, FLAC, M4A, OGG, Opus, WMA y WAV."
version = "1.0.0"
autor = "Proyecto zCommander"
licencia = "GPL-3.0-or-later"
api_minima = "1.0"
api_probada = "1.0"
entrada = "__init__:Complemento"
nivel = "intermedio"
permisos = ["escribir_fuera_de_paneles"]

[[ordenes]]
id = "editar"
etiqueta = "&Editar las etiquetas..."
ayuda = "Edita las etiquetas del archivo del cursor o de los marcados."
ambito = "panel"
menu = "complementos"
teclas = ["Ctrl+Shift+F2"]
nivel = "intermedio"
argumento = ""

[[ordenes]]
id = "desde_nombre"
etiqueta = "Etiquetas &desde el nombre..."
ayuda = "Rellena las etiquetas a partir del nombre del archivo con una máscara."
