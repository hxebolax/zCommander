[[configuracion]]
clave = "arrancar"
tipo = "opcion"
defecto = "al_usar"
opciones = [["al_usar", "Al usar una cuenta por primera vez"], ["al_iniciar", "Al iniciar zCommander"]]
etiqueta = "Cuándo arrancar el &motor de nubes:"
ayuda = "El motor de nubes (rclone) puede arrancar al usar una cuenta por primera vez o al iniciar zCommander."
pagina = "general"

[[configuracion]]
clave = "transferencias"
tipo = "entero"
defecto = 4
minimo = 1
maximo = 32
etiqueta = "&Transferencias simultáneas:"
ayuda = "Cuántos archivos copia rclone a la vez. En Google Drive conviene 2 a 4. Al cambiarlo se reinicia el motor si no hay transferencias."
pagina = "general"

[[configuracion]]
clave = "reintentos"
tipo = "entero"
defecto = 3
minimo = 0
maximo = 10
etiqueta = "Reintentos de cada &operación:"
ayuda = "Veces que rclone repite una operación que falló por un error pasajero."
pagina = "general"

[[configuracion]]
clave = "registro_detallado"
tipo = "bool"
defecto = false
etiqueta = "Registro &detallado de rclone (nivel INFO)"
ayuda = "Guarda en el registro de zCommander más mensajes de rclone, siempre sin contraseñas ni fichas de acceso. Nunca se vuelcan cabeceras."
pagina = "general"

[[configuracion]]
clave = "mostrar_experimentales"
tipo = "bool"
defecto = false
etiqueta = "Mostrar los servicios e&xperimentales"
ayuda = "Muestra en el asistente los servicios que rclone marca como experimentales, como Proton Drive o iCloud Drive."
pagina = "general"

[[configuracion]]
clave = "limite_subida_kib"
tipo = "entero"
defecto = 0
minimo = 0
maximo = 10000000
etiqueta = "Límite de &subida en KiB/s (0 sin límite):"
ayuda = "Velocidad máxima de subida de todas las nubes juntas."
pagina = "velocidad"

[[configuracion]]
clave = "limite_bajada_kib"
tipo = "entero"
defecto = 0
minimo = 0
maximo = 10000000
etiqueta = "Límite de &bajada en KiB/s (0 sin límite):"
ayuda = "Velocidad máxima de bajada de todas las nubes juntas."
pagina = "velocidad"

[[configuracion]]
clave = "horario_limites"
tipo = "texto"
defecto = ""
etiqueta = "&Horario de límites (formato de rclone):"
ayuda = "Por ejemplo 08:00,512k 23:00,off: de 8 a 23 limita a 512 KiB/s y después sin límite. Si hay horario, manda sobre los límites fijos. También se edita por franjas en las propiedades de cada cuenta."
pagina = "velocidad"

[[configuracion]]
clave = "cache_listados_s"
tipo = "entero"
defecto = 30
minimo = 0
maximo = 3600
etiqueta = "Segundos que se recuerdan los &listados:"
ayuda = "Durante este tiempo no se vuelve a pedir a la nube el contenido de una carpeta ya listada. 0 lo pide siempre."
pagina = "cuentas"

[[configuracion]]
clave = "papelera_por_defecto"
tipo = "bool"
defecto = true
etiqueta = "Las cuentas nuevas borran a la papel&era del servicio"
ayuda = "Lo que se borra va a la papelera de la nube, si el servicio la tiene."
pagina = "cuentas"

[[configuracion]]
clave = "formato_docs"
tipo = "texto"
defecto = "docx,xlsx,pptx"
etiqueta = "&Formato de los documentos de Google en cuentas nuevas:"
ayuda = "Formatos con los que se bajan los Documentos, Hojas y Presentaciones de Google, separados por comas."
pagina = "cuentas"

[[configuracion]]
clave = "copia_entre_cuentas"
tipo = "bool"
defecto = false
etiqueta = "Copiar en el &servidor entre cuentas del mismo servicio"
ayuda = "Usa ServerSideAcrossConfigs de rclone; si falla, la copia pasa por zCommander."
pagina = "cuentas"

[[configuracion]]
clave = "servir_solo_local"
tipo = "bool"
defecto = true
etiqueta = "Compartir en la red solo en este e&quipo salvo confirmación"
ayuda = "Compartir en la red escucha solo en 127.0.0.1 si no se confirma expresamente abrirlo a la red local."
pagina = "cuentas"

[[configuracion]]
clave = "aviso_winfsp_mostrado"
tipo = "bool"
defecto = false
interna = true
etiqueta = "Aviso de WinFsp mostrado"
ayuda = "Interna: si ya se mostró el aviso de WinFsp de Acerca de."

[[secretos]]
nombre = "rclone_config_pass"
