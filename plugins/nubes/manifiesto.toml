# Manifiesto completo de Nubes (diseño 2.0, 3.3 y 12; bloque NU).

formato = 1
id = "zc.nubes"
bloque = "NU"
nombre = "Nubes"
descripcion = "Convierte cada cuenta de nube y cada servidor WebDAV en una unidad más del panel, con copia, sincronización, enlaces, carpetas cifradas, uniones y montaje como letra mediante rclone."
version = "1.0.0"
autor = "Proyecto zCommander"
licencia = "GPL-3.0-or-later"
api_minima = "1.0"
api_probada = "1.0"
entrada = "__init__:Complemento"
# Siempre al arrancar: registra el esquema nube:// para que las direcciones de la sesión se abran; con
# arrancar = al_usar no arranca rclone hasta el primer uso de una cuenta (12.2).
activacion = ["al_arrancar"]
permisos = ["red", "secretos", "ejecutar_programas", "segundo_plano", "portapapeles"]
nivel = "intermedio"
prueba = "limites"
ayuda = "doc/es/leeme.md"
cambios = "doc/es/cambios.md"

[requiere]
componentes = ["rclone"]

